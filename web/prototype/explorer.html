<body>

  <div style="position:absolute;left:328px;right:408px;bottom:308px;height:56px;padding:0 16px;background:#fff;border:1px solid #DDE1E8;border-radius:14px;box-sizing:border-box;display:flex;align-items:center;gap:14px">
    <label for="yr" class="mono" style="font-size:12px;font-weight:500;color:#4B5563">AS OF</label>

  <div id="table" style="position:absolute;left:24px;right:408px;bottom:24px;height:272px;background:#fff;border:1px solid #DDE1E8;border-radius:16px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden"></div>
</div>

<script>
// ---- tiny stand-in for the design canvas runtime ----
class DCLogic { constructor() { this.state = {}; } setState(p) { Object.assign(this.state, p); update(); } }

// ---- live data (set by liveCompany() when `itx serve` is running) ----
let API = false;      // true once /api/health answers
let LIVE = null;      // the searched company's graph, converted by fromApi()
const THIS_YEAR = new Date().getFullYear();

// How each relation reads from either end, for the table and node roles.
const REL_OUT = { supplies: 'SUPPLIES', partners_with: 'PARTNER', subsidiary_of: 'SUBSIDIARY OF', acquired: 'ACQUIRED',
  invested_in: 'INVESTED IN', contracted_by: 'CONTRACTED BY', manufactures_for: 'MAKES FOR' };
const REL_IN = { supplies: 'SUPPLIED BY', partners_with: 'PARTNER', subsidiary_of: 'PARENT OF', acquired: 'ACQUIRED BY',
  invested_in: 'INVESTOR', contracted_by: 'CONTRACTS', manufactures_for: 'MADE BY' };
const isSupply = (l) => !l.rel || l.rel === 'supplies';

// API payload (nodes/edges, see docs/SCHEMA.md) -> the Explorer's {companies, links, competes}.
function fromApi(b) {
  const idOf = {};
  b.nodes.forEach((n) => { idOf[n.id] = n.ticker || n.name; });
  const companies = b.nodes.map((n) => ({
    id: idOf[n.id], tk: n.ticker || null, name: n.name, exch: n.listed ? 'SEC filer' : 'private / foreign, not an SEC filer', country: n.country || null,
    sic: n.sic ? n.sic + ' · ' + (n.sic_desc || '') : null, listed: !!n.listed,
    tags: (n.tags || []).map((t) => [t.tag, t.role]), expanded: !!n.expanded,
    // 5-year history from the API; older data only has the latest year.
    fin: n.history || Object.fromEntries(Object.entries(n.financials || {}).map(([k, v]) => [k, [v]]))
  }));
  const yearOf = (d) => (d ? Number(String(d).slice(0, 4)) : null);
  const links = [], competes = [];
  b.edges.forEach((e) => {
    const a = idOf[e.source], t = idOf[e.target];
    if (e.relation === 'competes_with') { competes.push([a, t, e.confidence]); return; }
    const ys = (e.citations || []).map((c) => yearOf(c.filed)).filter(Boolean);
    links.push({ from: a, to: t, rel: e.relation, comp: (e.components || [])[0] || null,   // only components the filing named
      imp: null, country: null, conf: e.confidence,
      first: ys.length ? Math.min(...ys) : THIS_YEAR, last: ys.length ? Math.max(...ys) : THIS_YEAR });
  });
  const all = links.flatMap((l) => [l.first, l.last]);
  const hi = all.length ? Math.max(...all) : THIS_YEAR, lo = all.length ? Math.min(...all, hi - 4) : hi - 4;
  const centerNode = b.nodes.find((n) => n.id === b.center) || {};
  return { companies, links, competes, live: true, centerId: idOf[b.center], filings: b.filings || [],
    extraction: b.extraction || { status: centerNode.expanded ? 'done' : 'not_started' },
    years: Array.from({ length: hi - lo + 1 }, (_, i) => lo + i) };
}

// quiet = a refresh while extraction runs: keep the user's selection / filters, no "Fetching" message.
async function liveCompany(query, quiet) {
  if (!quiet) app.setState({ msg: 'Fetching ' + query + ' from SEC EDGAR…' });
  const t0 = performance.now();
  try {
    const r = await fetch('/api/company/' + encodeURIComponent(query));
    const body = await r.json();
    if (!r.ok) { if (!quiet) app.setState({ msg: body.detail || 'Error ' + r.status }); return; }
    const next = fromApi(body);
    if (quiet) {
      if (!LIVE || LIVE.centerId !== next.centerId) return;   // user moved on to another company
      next.loadedIn = LIVE.loadedIn;
      LIVE = next;
      if (!LIVE.companies.some((c) => c.id === app.state.sel)) app.state.sel = LIVE.centerId;
    } else {
      next.loadedIn = ((performance.now() - t0) / 1000).toFixed(1);
      LIVE = next;
      $('xq').value = '';
      app.state = { center: LIVE.centerId, sel: LIVE.centerId, depth: 1, msg: '' };
    }
    update();
    if (!quiet) startExtraction(LIVE.centerId, LIVE.extraction);
  } catch (e) {
    if (!quiet) app.setState({ msg: 'API not reachable. Is `itx serve` running?' });
  }
}

// ---- background extraction: start it, poll progress, redraw the network as relationships arrive ----
let LLM = { ready: false, problem: null };   // from /api/health
let pollToken = 0;

async function startExtraction(ticker, state, refresh) {
  let s = state;
  if (refresh || (s.status === 'not_started' && LLM.ready)) {
    try {
      const r = await fetch('/api/extract/' + encodeURIComponent(ticker) + (refresh ? '?refresh=true' : ''), { method: 'POST' });
      s = await r.json();
      if (!r.ok) s = { status: 'failed', error: s.detail || 'Error ' + r.status };
    } catch (e) { s = { status: 'failed', error: 'API not reachable.' }; }
    setJob(ticker, s);
  }
  if (s.status === 'queued' || s.status === 'running') poll(ticker, s.found || 0);
}

function setJob(ticker, s) {
  if (LIVE && LIVE.centerId === ticker) { LIVE.extraction = s; update(); }
}

async function poll(ticker, seen) {
  const token = ++pollToken;                  // a newer search/poll cancels this one
  let found = seen;
  while (token === pollToken) {
    await new Promise((res) => setTimeout(res, 1500));
    if (token !== pollToken || !LIVE || LIVE.centerId !== ticker) return;
    let s;
    try { s = await (await fetch('/api/jobs/' + encodeURIComponent(ticker))).json(); } catch (e) { continue; }
    const finished = s.status === 'done' || s.status === 'failed';
    if ((s.found || 0) > found || finished) {  // new relationships (or the end): redraw from the database
      found = s.found || 0;
      await liveCompany(ticker, true);
    }
    setJob(ticker, s);
    if (finished) return;
  }
}

class Component extends DCLogic {
  data() {
    return LIVE || this.sampleData();
  }

  sampleData() {
    const C =(id, name, exch, country, sic, listed, tags) => ({ id, name, exch, country, sic, listed, tags });
    const companies = [
      C('NVDA', 'NVIDIA', 'Nasdaq', 'US', '3674 · Semiconductors & related devices', true, [['ai compute','platform'],['semiconductors','maker'],['robotics','supplier'],['automotive','supplier']]),
      C('TSM', 'Taiwan Semiconductor', 'NYSE (ADR)', 'Taiwan', '3674 · Semiconductors & related devices', true, [['semiconductors','maker']]),
      C('TER', 'Teradyne', 'Nasdaq', 'US', '3825 · Instruments for measuring & testing electricity', true, [['robotics','maker'],['semiconductors','supplier']]),
      C('ISRG', 'Intuitive Surgical', 'Nasdaq', 'US', '3845 · Electromedical apparatus', true, [['medical devices','maker'],['robotics','maker']]),
      C('SYM', 'Symbotic', 'Nasdaq', 'US', null, true, [['robotics','maker'],['logistics','supplier']]),
      C('OUST', 'Ouster', 'NYSE', 'US', null, true, [['sensors','maker'],['robotics','supplier']]),
      C('CGNX', 'Cognex', 'Nasdaq', 'US', null, true, [['sensors','maker'],['robotics','supplier']]),
      C('HDS', 'Harmonic Drive Systems', 'Tokyo', 'Japan', null, false, [['robotics','supplier']]),
      C('FANUC', 'Fanuc', 'Tokyo', 'Japan', null, false, [['robotics','maker']]),
      C('TM', 'Toyota Motor', 'NYSE (ADR)', 'Japan', '3711 · Motor vehicles & passenger car bodies', true, [['automotive','maker'],['robotics','customer']]),
      C('TSLA', 'Tesla', 'Nasdaq', 'US', '3711 · Motor vehicles & passenger car bodies', true, [['automotive','maker'],['robotics','maker']]),
      C('AMZN', 'Amazon', 'Nasdaq', 'US', '5961 · Retail: catalog & mail-order houses', true, [['cloud software','platform'],['retail','operator'],['robotics','customer']]),
      C('WMT', 'Walmart', 'NYSE', 'US', '5331 · Retail: variety stores', true, [['retail','operator'],['robotics','customer']]),
      C('MSFT', 'Microsoft', 'Nasdaq', 'US', '7372 · Prepackaged software', true, [['cloud software','platform'],['ai compute','customer']]),
      C('RKLB', 'Rocket Lab', 'Nasdaq', 'US', null, true, [['space','maker']]),
      C('PL', 'Planet Labs', 'NYSE', 'US', null, true, [['space','operator']]),
      C('ASTS', 'AST SpaceMobile', 'Nasdaq', 'US', null, true, [['space','operator']]),
      C('HXL', 'Hexcel', 'NYSE', 'US', null, true, [['materials','maker'],['space','supplier']]),
      C('LMT', 'Lockheed Martin', 'NYSE', 'US', '3760 · Guided missiles & space vehicles', true, [['defense','maker'],['space','maker']])
    ];
    const L = (from, to, comp, imp, country, first, last) => ({ from, to, comp, imp, country, first, last });
    const links = [
      L('TSM','NVDA','foundry chips','single','Taiwan',2021,2025),
      L('TER','TSM','test equipment','major','US',2021,2025),
      L('NVDA','TER','GPUs',null,'Taiwan',2023,2025),
      L('NVDA','ISRG','GPUs',null,'Taiwan',2022,2025),
      L('NVDA','SYM','GPUs',null,'Taiwan',2023,2025),
      L('NVDA','TSLA','GPUs',null,'Taiwan',2021,2025),
      L('NVDA','TM','automotive SoCs',null,'Taiwan',2022,2025),
      L('NVDA','MSFT','GPUs','major','Taiwan',2021,2025),
      L('NVDA','AMZN','GPUs','major','Taiwan',2022,2025),
      L('NVDA','LMT','GPUs',null,'Taiwan',2024,2025),
      L('HDS','TER','harmonic reducers','single','Japan',2021,2025),
      L('HDS','FANUC','harmonic reducers','major','Japan',2021,2025),
      L('FANUC','TM','robot arms',null,'Japan',2021,2025),
      L('OUST','SYM','lidar',null,'US',2022,2023),
      L('CGNX','TM','machine vision',null,'US',2021,2022),
      L('CGNX','SYM','machine vision',null,'US',2024,2025),
      L('TER','AMZN','mobile robots',null,'US',2023,2025),
      L('SYM','WMT','warehouse automation','major','US',2021,2025),
      L('SYM','AMZN','warehouse automation',null,'US',2025,2025),
      L('HXL','RKLB','carbon fiber',null,'US',2022,2025),
      L('HXL','LMT','carbon fiber','major','US',2021,2025),
      L('RKLB','PL','launch services',null,'New Zealand',2021,2023),
      L('RKLB','ASTS','launch services',null,'US',2024,2025),
      L('OUST','TSLA','lidar',null,'US',2021,2022)
    ];
    const competes = [['TSLA','TM'],['AMZN','WMT'],['AMZN','MSFT'],['RKLB','LMT'],['OUST','CGNX'],['HDS','FANUC']];
    return { companies, links, competes, live: false, years: [2021, 2022, 2023, 2024, 2025] };
  }

  renderVals() {
    const st = this.state || {};
    const D = this.data();
    const COL = { 'ai compute': '#4F46E5', 'semiconductors': '#0284C7', 'robotics': '#EA580C', 'automotive': '#059669', 'cloud software': '#9333EA', 'retail': '#DB2777', 'medical devices': '#0D9488', 'sensors': '#CA8A04', 'space': '#2563EB', 'defense': '#475569', 'materials': '#78716C', 'logistics': '#B45309' };
    const colOf = (t) => COL[t] || '#6B7280';
    const byId = {}; D.companies.forEach((c) => { byId[c.id] = c; });
    // What to show in ticker spots: the company's primary ticker, or "—" for private / foreign
    // companies (live data). Sample companies use their id as the ticker.
    const tick = (id) => (byId[id] && 'tk' in byId[id] ? (byId[id].tk || '—') : id);
    const main = (c) => (c.tags[0] ? c.tags[0][0] : 'other');
    const COMPS = Array.from(new Set(D.links.filter(isSupply).map((l) => l.comp).filter(Boolean))).sort();
    const hasCountry = D.companies.some((c) => c.country);

    const maxYear = D.years[D.years.length - 1];
    const year = D.years.includes(st.year) ? st.year : maxYear, showStale = st.showStale !== false;
    const comp = st.comp || null, centerId = st.center || 'NVDA';
    const CN = '#comp';
    const selId = st.sel || (comp ? CN : centerId);
    const depth = st.depth == null ? 1 : st.depth, filter = st.filter || 'all', tag = st.tag || null;
    const view = st.view || 'network', expo = st.expo || 'all', tab = st.tab || 'rel';
    // Confidence: real model scores for live data; the sample makes up stable fake ones.
    const fakeConf = (a, b) => { let h = 0; (a + b).split('').forEach((ch) => { h = (h * 31 + ch.charCodeAt(0)) % 997; }); return 0.62 + (h % 34) / 100; };
    const linkConf = (l) => (l.conf != null ? l.conf : fakeConf(l.from, l.to));
    const rivalConf = (a, b) => { const p = D.competes.find(([x, y]) => (x === a && y === b) || (x === b && y === a)); return p && p[2] != null ? p[2] : fakeConf(a, b); };

    const active = D.links.filter((l) => l.first <= year).map((l) => ({ ...l, stale: l.last < year })).filter((l) => showStale || !l.stale);
    const inL = (id) => active.filter((l) => l.to === id);
    const outL = (id) => active.filter((l) => l.from === id);
    const comN = (id) => D.competes.filter(([a, b]) => a === id || b === id).map(([a, b]) => (a === id ? b : a));

    const pick = (id) => () => this.setState({ sel: id });
    // Live: re-centring on another listed company fetches its own graph from the API.
    const recenter = (id) => () => (D.live && byId[id] && byId[id].listed)
      ? liveCompany(id)
      : this.setState({ center: id, sel: id, comp: null, tag: null, tab: 'rel', msg: '' });
    const openComp = (c) => () => this.setState({ comp: c, sel: CN, tag: null, tab: 'rel', msg: '' });
    const setTag = (t) => () => this.setState({ tag: t });

    // ----- which nodes are on screen -----
    const hop = {}, role = {};
    if (comp) {
      hop[CN] = 0;
      active.filter((l) => l.comp === comp).forEach((l) => {
        if (filter !== 'cus') { hop[l.from] = 1; role[l.from] = 'makes it'; }
        if (filter !== 'sup') { if (hop[l.to] == null) { hop[l.to] = 1; role[l.to] = 'buys it'; } }
      });
    } else {
      hop[centerId] = 0;
      if (depth >= 1) {
        if (filter === 'all' || filter === 'sup') inL(centerId).forEach((l) => { hop[l.from] = 1; role[l.from] = !isSupply(l) ? REL_IN[l.rel].toLowerCase() : (l.imp === 'single' ? 'single source' : 'supplier'); });
        if (filter === 'all' || filter === 'cus') outL(centerId).forEach((l) => { hop[l.to] = 1; role[l.to] = role[l.to] ? 'partner' : (!isSupply(l) ? REL_OUT[l.rel].toLowerCase() : (l.imp === 'major' ? 'major customer' : 'customer')); });
        if (filter === 'all' || filter === 'com') comN(centerId).forEach((x) => { if (hop[x] == null) { hop[x] = 1; role[x] = 'rival'; } });
      }
      if (depth >= 2) Object.keys(hop).filter((x) => hop[x] === 1 && byId[x].listed).forEach((x) => {
        inL(x).map((l) => l.from).concat(outL(x).map((l) => l.to)).forEach((y) => { if (hop[y] == null) { hop[y] = 2; role[y] = '2 hops'; } });
      });
    }
    const visible = Object.keys(hop);

    // ----- layout -----
    // Many neighbours (a real 10-K can name 25+ competitors) -> smaller "compact" cards on several
    // rings instead of one overlapping ring. The map then scales down to fit its area (see update()).
    const ringIds = visible.filter((i) => hop[i] >= 1);
    const compact = !comp && view !== 'region' && ringIds.length > 12;
    const NW = compact ? 124 : 150, NH = compact ? 34 : 46;
    let mapW = 640, mapH = 400;
    let cx = 320, cy = 200;
    if (comp) {                       // component view: two columns, as tall as the longer one
      const n = Math.max(...['makes it', 'buys it'].map((r) => visible.filter((id) => role[id] === r).length), 1);
      mapH = Math.max(400, n * 62 + 60); cy = mapH / 2;
    }
    const pos = {};
    let regions = [];
    if (view === 'region' && hasCountry) {
      const REG = [['US', 'United States', 0, 330, [85, 245]], ['Japan', 'Japan', 345, 160, [425]], ['Taiwan', 'Taiwan', 520, 150, [595]]];
      const placed = {};
      REG.forEach(([key, label, x, w, cols]) => {
        regions.push({ label, style: 'position:absolute;left:' + x + 'px;top:0;width:' + w + 'px;height:400px;box-sizing:border-box;border:1px dashed #C5CAD3;border-radius:14px;background:rgba(255,255,255,0.45)', labelStyle: 'position:absolute;left:12px;top:8px;font:500 11px IBM Plex Mono,monospace;color:#4B5563;letter-spacing:0.04em' });
        const ids = visible.filter((id) => id !== CN && (byId[id].country === key || (key === 'US' && ['US', 'Japan', 'Taiwan'].indexOf(byId[id].country) === -1)));
        ids.forEach((id, i) => { pos[id] = { x: cols[i % cols.length], y: 60 + Math.floor(i / cols.length) * 54 }; placed[id] = 1; });
      });
      if (hop[CN] != null) pos[CN] = { x: 165, y: 30 };
      regions.forEach((g) => { g.label = g.label.toUpperCase(); });
    } else if (comp) {
      pos[CN] = { x: cx, y: cy };
      const makers = visible.filter((id) => role[id] === 'makes it'), buyers = visible.filter((id) => role[id] === 'buys it');
      makers.forEach((id, i) => { pos[id] = { x: 90, y: cy + (i - (makers.length - 1) / 2) * 62 }; });
      buyers.forEach((id, i) => { pos[id] = { x: 550, y: cy + (i - (buyers.length - 1) / 2) * 62 }; });
    } else {
      // Concentric ellipses around the centre; each ring holds as many cards as fit its perimeter.
      // Hop-1 neighbours (grouped by role, so rivals sit together) fill the inner rings, hop-2 the outer.
      const order = visible.filter((i) => hop[i] === 1).sort((a, b) => (role[a] + a).localeCompare(role[b] + b))
        .concat(visible.filter((i) => hop[i] === 2));
      const rings = [];
      let left = order.length, k = 0;
      while (left > 0) {
        const rx = 230 + k * (NW + 18), ry = rx * 0.6;   // rings a card-width apart, so they never touch
        const per = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));   // ellipse perimeter
        const cap = Math.max(6, Math.floor(per / (NW + 14)));
        rings.push({ rx, ry, n: Math.min(cap, left) });
        left -= cap; k++;
      }
      const outer = rings.length ? rings[rings.length - 1] : { rx: 0, ry: 0 };
      mapW = Math.max(640, 2 * (outer.rx + NW / 2 + 12)); mapH = Math.max(400, 2 * (outer.ry + NH / 2 + 12));
      cx = mapW / 2; cy = mapH / 2;
      pos[centerId] = { x: cx, y: cy, a: 0 };
      let idx = 0;
      rings.forEach((r, ri) => {
        for (let i = 0; i < r.n; i++, idx++) {
          const a = -Math.PI / 2 + 2 * Math.PI * (i + (ri % 2 ? 0.5 : 0)) / r.n;
          pos[order[idx]] = { x: cx + r.rx * Math.cos(a), y: cy + r.ry * Math.sin(a), a };
        }
      });
    }

const app = new Component();
let H = [];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const on = (fn) => { H.push(fn); return 'data-h="' + (H.length - 1) + '"'; };
const btn = (o, inner, extra) => '<button type="button" ' + (o.pick ? on(o.pick) : '') + ' style="' + esc(o.style || '') + '" ' + (extra || '') + '>' + inner + '</button>';
const $ = (id) => document.getElementById(id);

// ---- financials (XBRL history from the API) ----
const METRICS = [   // [key, label, group]; order = how they're shown
  ['revenue', 'Revenue', 'Income'], ['gross_profit', 'Gross profit', 'Income'],
  ['operating_income', 'Operating income', 'Income'], ['net_income', 'Net income', 'Income'],
  ['rnd', 'R&D', 'Income'], ['eps_diluted', 'EPS (diluted)', 'Income'],
  ['cash', 'Cash', 'Balance sheet'], ['total_assets', 'Total assets', 'Balance sheet'],
  ['total_liabilities', 'Total liabilities', 'Balance sheet'], ['equity', 'Equity', 'Balance sheet'],
  ['long_term_debt', 'Long-term debt', 'Balance sheet'],
  ['operating_cash_flow', 'Operating cash flow', 'Cash flow'], ['capex', 'Capex', 'Cash flow'],
];

function money(v, key) {
  if (key === 'eps_diluted') return '$' + Number(v).toFixed(2);
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  for (const [d, u] of [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (a >= d) return s + '$' + (a / d).toFixed(2) + u;
  return s + '$' + a;
}

function spark(vals) {               // oldest -> newest, 60x18
  if (vals.length < 2) return '';
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => ((i / (vals.length - 1)) * 56 + 2) + ',' + (16 - ((v - lo) / span) * 14)).join(' ');
  return '<svg width="60" height="18" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="#4F46E5" stroke-width="1.5"/></svg>';
}

function finTable(h) {
  let group = '', rows = '';
  // Header date: the newest fiscal year across all metrics (not whichever metric comes first).
  const latest = { period_end: Object.values(h).map((s) => (s[0] || {}).period_end || '').sort().pop() };
  for (const [key, label, g] of METRICS) {
    const s = h[key]; if (!s || !s.length) continue;
    if (g !== group) { group = g; rows += '<div style="grid-column:1/-1;font-size:11px;color:#6B7280;margin-top:6px;letter-spacing:0.04em">' + g.toUpperCase() + '</div>'; }
    const cur = s[0].value, prev = s[1] && s[1].value;
    const chg = prev ? (cur - prev) / Math.abs(prev) * 100 : null;
    rows += '<span title="FY ending ' + esc(s[0].period_end) + '" style="color:#374151;font-family:Inter,sans-serif">' + label + '</span>' +
      '<span style="text-align:right;font-weight:500">' + money(cur, key) + '</span>' +
      '<span>' + spark(s.map((r) => r.value).reverse()) + '</span>' +
      '<span style="text-align:right;color:' + (chg == null ? '#9CA3AF' : chg >= 0 ? '#059669' : '#DC2626') + '">' +
        (chg == null ? '' : (chg >= 0 ? '+' : '') + chg.toFixed(0) + '%') + '</span>';
  }
  return '<div><div style="font-size:12px;color:#4B5563;margin-bottom:4px">Financials · FY ending ' + esc(latest.period_end || '') +
    ' · 5-year trend · vs prior year</div>' +
    '<div class="mono" style="display:grid;grid-template-columns:minmax(0,1fr) auto 60px 44px;gap:3px 10px;align-items:center;font-size:12px;color:#111827">' + rows + '</div></div>';
}

// ---- extraction progress block in the profile panel ----
const STEP_LABEL = { queued: 'Queued', starting: 'Starting', downloading: 'Downloading the annual report',
  tagging: 'Classifying its industries', reading: 'Reading the annual report', done: 'Done' };

function jobBlock(P) {
  const j = P.job;
  if (!j) return '';
  const box = (inner, bg, border) => '<div style="background:' + bg + ';border:1px solid ' + border + ';border-radius:10px;padding:10px 12px;font-size:13px;color:#374151;line-height:1.5">' + inner + '</div>';
  if (j.status === 'queued' || j.status === 'running') {
    const pct = j.total ? Math.round(100 * j.done / j.total) : (j.status === 'queued' ? 0 : 4);
    const what = j.status === 'queued'
      ? 'Queued' + (j.ahead ? ' · ' + j.ahead + ' compan' + (j.ahead === 1 ? 'y' : 'ies') + ' ahead' : '')
      : (STEP_LABEL[j.step] || 'Working') + (j.step === 'reading' && j.total ? ' · passage ' + (j.done + 1) + ' of ' + j.total : '') + '…';
    return box('<div style="font-weight:500;color:#111827">' + esc(what) + '</div>' +
      '<div style="height:6px;background:#E5E7EB;border-radius:999px;margin:8px 0 6px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:#4F46E5;border-radius:999px;transition:width .4s"></div></div>' +
      '<div class="mono" style="font-size:12px;color:#4B5563">' + (j.found || 0) + ' relationship' + (j.found === 1 ? '' : 's') + ' found so far · the map fills in as they arrive</div>',
      '#EEF0FF', '#C7CBF5');
  }
  if (j.status === 'failed') {
    return box('<div style="color:#B91C1C;font-weight:500">Reading the annual report failed</div><div>' + esc(j.error || 'Unknown error') + '</div>' +
      btn({ pick: P.rereadPick, style: 'margin-top:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #DDE1E8;background:#fff;font:500 12px Inter,sans-serif;cursor:pointer' }, 'Retry'),
      '#FEF2F2', '#FECACA');
  }
  if (j.status === 'done' && LLM.ready) {
    return '<div style="font-size:12px;color:#6B7280">Relationships read from its latest annual report · ' +
      btn({ pick: P.rereadPick, style: 'border:none;background:none;padding:0;color:#4F46E5;font:12px Inter,sans-serif;cursor:pointer;text-decoration:underline' }, 'read again') + '</div>';
  }
  return '';
}

function update() {
  H = [];
  const V = app.renderVals();

  // map: sized to its layout, then scaled down (never up) to fit the space between the panels
  const map = $('map'), area = map.parentElement;
  const fit = area && area.clientWidth ? Math.min(1, area.clientWidth / V.mapW, area.clientHeight / V.mapH) : 1;
  map.style.width = V.mapW + 'px'; map.style.height = V.mapH + 'px';
  map.style.transform = 'translate(-50%,-50%) scale(' + fit.toFixed(3) + ')';
  $('map').innerHTML =
    V.regions.map((g) => '<div style="' + esc(g.style) + '"><span style="' + esc(g.labelStyle) + '">' + esc(g.label) + '</span></div>').join('') +
    V.edges.map((e) => '<div style="' + esc(e.style) + '"></div>').join('') +
    V.nodes.map((n) => btn(n, '<span style="' + esc(n.dot) + '">' + esc(n.initial) + '</span><span style="display:flex;flex-direction:column;line-height:1.25;min-width:0;text-align:left"><span style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(n.name) + '</span><span style="' + esc(n.subStyle) + '">' + esc(n.sub) + '</span></span>', 'aria-label="' + esc(n.aria) + '" title="' + esc(n.title || n.aria) + '"')).join('');

  // search bar, year bar
  $('depths').innerHTML = V.depths.map((d) => btn(d, esc(d.label))).join('');
  $('views').innerHTML = V.views.map((v) => btn(v, esc(v.label))).join('');
  $('staleBtn').innerHTML = btn({ pick: V.toggleStale, style: V.staleStyle }, esc(V.staleLabel));
  $('yearLabel').textContent = V.year;
  $('yr').min = V.years[0]; $('yr').max = V.years[V.years.length - 1];
  $('yr').value = V.year;
  $('yrTicks').innerHTML = V.years.map((y) => '<span>' + y + '</span>').join('');
  $('msg').style.display = V.msg ? 'flex' : 'none';
  $('msg').innerHTML = V.msg ? '<div style="max-width:660px;padding:10px 14px;background:#fff;border:1px solid #DDE1E8;border-radius:10px;font-size:13px;color:#374151">' + esc(V.msg) + '</div>' : '';

  // left card
  $('left').innerHTML =
    '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:18px;font-weight:600">Investment Terminal</div>' +
    '<div style="font-size:12px;color:#4B5563;margin-top:2px">' + esc(V.live ? 'Live · SEC EDGAR · loaded in ' + V.loadedIn + 's'
      : (V.api ? 'Sample data shown · search any US-listed company' : 'Sample data · illustrative links')) + '</div>' +
    '<div style="font-size:12px;color:#4B5563;margin:14px 0 4px">Industries on screen</div>' +
    V.legend.map((l) => btn(l, '<span style="display:flex;align-items:center;gap:10px"><span style="' + esc(l.dot) + '"></span>' + esc(l.tag) + '</span><span style="font-size:12px;color:#4B5563">' + esc(l.n) + '</span>')).join('') +
    (V.hasCountry
      ? '<div style="font-size:12px;color:#4B5563;margin:14px 0 6px">Supply exposure to</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px">' + V.expos.map((x) => btn(x, esc(x.label))).join('') + '</div>' +
        (V.expoOn ? '<div style="margin-top:8px;font-size:12px;color:#B45309;line-height:1.5">' + esc(V.expoNote) + '</div>' : '')
      : '') +
    '<div style="font-size:12px;color:#4B5563;margin:14px 0 6px">Try</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px">' + V.quick.map((q) => btn({ pick: q.pick, style: 'height:32px;padding:0 10px;border-radius:8px;border:1px solid #DDE1E8;background:#fff;font:500 12px IBM Plex Mono,monospace;color:#111827;cursor:pointer' }, esc(q.t))).join('') + '</div>';

  // profile panel
  const P = V.p;
  const chipList = (items, dark) => items.map((c) => btn({ pick: c.pick, style: 'min-height:30px;padding:0 10px;border-radius:8px;border:1px solid ' + (dark ? '#111827' : '#DDE1E8') + ';background:' + (dark ? '#111827' : '#fff') + ';color:' + (dark ? '#fff' : '#111827') + ';font:12px Inter,sans-serif;cursor:pointer' }, esc(c.label))).join('');
  $('panel').innerHTML =
    '<div style="display:flex;align-items:center;gap:14px"><span style="' + esc(P.badge) + '">' + esc(P.initial) + '</span><div style="min-width:0"><div style="font-family:\'Space Grotesk\',sans-serif;font-size:22px;font-weight:600;line-height:1.2">' + esc(P.name) + '</div><div style="font-size:13px;color:#4B5563">' + esc(P.sub) + '</div></div></div>' +
    '<div style="font-size:12px;color:#4B5563;line-height:1.5">' + esc(P.meta) + '</div>' +
    (P.isCo ? '<div><div style="font-size:12px;color:#4B5563;margin-bottom:8px">Industries</div><div style="display:flex;flex-wrap:wrap;gap:6px">' + P.tags.map((t) => btn(t, '<span style="' + esc(t.dot) + '"></span>' + esc(t.tag) + ' <span style="color:#6B7280">· ' + esc(t.role) + '</span>')).join('') + '</div></div>' : '') +
    '<div><div style="font-size:12px;color:#4B5563;margin-bottom:8px">' + esc(P.makesLabel) + '</div><div style="display:flex;flex-wrap:wrap;gap:6px">' + chipList(P.makes, true) + '</div>' + (P.makesEmpty ? '<div style="font-size:13px;color:#6B7280">None named</div>' : '') + '</div>' +
    '<div><div style="font-size:12px;color:#4B5563;margin-bottom:8px">' + esc(P.buysLabel) + '</div><div style="display:flex;flex-wrap:wrap;gap:6px">' + chipList(P.buys, false) + '</div>' + (P.buysEmpty ? '<div style="font-size:13px;color:#6B7280">None named</div>' : '') + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' + P.stats.map((k) => '<div style="background:#F5F6F9;border-radius:10px;padding:10px"><div style="font-size:11px;color:#4B5563">' + esc(k.label) + '</div><div style="' + esc(k.style) + '">' + esc(k.value) + '</div></div>').join('') + '</div>' +
    jobBlock(P) +
    (P.note ? '<div style="font-size:13px;color:#4B5563;background:#F5F6F9;border-radius:10px;padding:10px 12px;line-height:1.5">' + esc(P.note) + '</div>' : '') +
    (P.canCenter ? btn({ pick: P.center, style: 'height:44px;border-radius:10px;border:none;background:#4F46E5;color:#fff;font:600 14px Inter,sans-serif;cursor:pointer' }, esc(P.centerLabel)) : '') +
    (P.fin && Object.keys(P.fin).length ? finTable(P.fin) : '') +
    (P.filings && P.filings.length ? '<div><div style="font-size:12px;color:#4B5563;margin-bottom:6px">Annual reports</div>' +
      P.filings.map((f) => '<div class="mono" style="font-size:12px;color:#374151;line-height:1.8">' + esc(f.form) + ' · filed ' + esc(f.filed) +
        ' · <a href="' + esc(f.url) + '" target="_blank" rel="noopener" style="color:#4F46E5">open</a></div>').join('') + '</div>' : '') +
    '<div style="margin-top:auto;border-top:1px solid #EEF0F4;padding-top:12px;font-size:12px;color:#4B5563;line-height:1.7">' +
    '<div><span style="display:inline-block;width:22px;border-top:4px solid #4F46E5;vertical-align:middle;margin-right:8px"></span>Major customer (≥10% of revenue)</div>' +
    '<div><span style="display:inline-block;width:22px;border-top:3px solid #DC2626;vertical-align:middle;margin-right:8px"></span>Single-source supplier</div>' +
    '<div><span style="display:inline-block;width:22px;border-top:2px dashed #9CA3AF;vertical-align:middle;margin-right:8px"></span>Stale: not in recent filings</div>' +
    '<div><span style="display:inline-block;width:22px;border-top:2px dashed #A855F7;vertical-align:middle;margin-right:8px"></span>Competitor</div></div>';

  // table
  $('table').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #EEF0F4">' +
      '<div style="display:flex;align-items:center;gap:10px;min-width:0">' +
        '<div style="display:flex;gap:2px;padding:3px;background:#F1F3F7;border-radius:10px">' + V.tabs.map((t) => btn(t, esc(t.label))).join('') + '</div>' +
        '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(V.tableTitle) + '</span>' +
        '<span class="mono" style="font-size:12px;color:#6B7280;white-space:nowrap">' + esc(V.tableCount) + '</span>' +
        (V.inTag ? btn({ pick: V.exitTag, style: 'height:28px;padding:0 10px;border-radius:8px;border:1px solid #DDE1E8;background:#fff;font-size:12px;color:#111827;cursor:pointer' }, 'Clear tag ×') : '') +
      '</div>' +
      '<div style="display:flex;gap:6px">' + V.filters.map((f) => btn(f, esc(f.label))).join('') + '</div>' +
    '</div>' +
    '<div style="' + esc(V.thead.style) + '">' + V.thead.cols.map((h) => '<span>' + esc(h) + '</span>').join('') + '</div>' +
    '<div style="flex:1;overflow:auto">' +
      V.rows.map((r) => btn(r, r.cells.map((c) => '<span style="' + esc(c.style) + '">' + esc(c.text) + '</span>').join(''))).join('') +
      (V.noRows ? '<div style="padding:20px 16px;color:#6B7280;font-size:13px">Nothing here for ' + esc(V.year) + ' with these filters.</div>' : '') +
    '</div>';

  window.__V = V;
}

// events (static elements are bound once so typing and dragging aren't interrupted)
document.addEventListener('click', (e) => { const el = e.target.closest('[data-h]'); if (el) H[Number(el.dataset.h)](); });
let suggestTimer;
$('xq').addEventListener('input', (e) => {
  app.state.q = e.target.value;
  if (!API) return;
  const q = e.target.value.trim();
  // Picking an autocomplete suggestion fires "input" with no typed character: search it straight away.
  if (!e.inputType || e.inputType === 'insertReplacementText') { if (q) liveCompany(q); return; }
  clearTimeout(suggestTimer);
  if (q.length < 2) return;
  suggestTimer = setTimeout(async () => {
    try {
      const hits = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json();
      $('xq-list').innerHTML = hits.map((h) => '<option value="' + esc(h.ticker) + '">' + esc(h.name) + '</option>').join('');
    } catch (_) {}
  }, 250);
});
$('xq').addEventListener('keydown', (e) => { if (e.key === 'Enter') window.__V.doSearch(); });
$('go').addEventListener('click', () => window.__V.doSearch());
$('yr').addEventListener('input', (e) => app.setState({ year: Number(e.target.value) }));
window.addEventListener('resize', () => update());   // re-fit the map to the new window size
update();

// Served by `itx serve`? Then switch to live search. Opened as a plain file, this fails and the sample stays.
fetch('/api/health').then((r) => r.json()).then((h) => {
  if (!h.ok) return;
  API = true;
  LLM = { ready: !!h.llm_ready, problem: h.llm_problem || null };
  $('xq').placeholder = 'Any US-listed company: ticker or name';
  $('xq').focus();
  update();
}).catch(() => {});
</script>
</body>

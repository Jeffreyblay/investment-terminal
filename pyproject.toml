[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-terminal"
version = "0.2.0"
description = "Free, open-source industry knowledge graph built from public company filings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rapidfuzz>=3.6",
  "pyyaml>=6.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.14"]
prices = ["yfinance>=0.2.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]   # httpx: FastAPI's TestClient

[project.scripts]
itx = "terminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
